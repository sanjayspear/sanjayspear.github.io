<div class="navbar navbar-expand-lg navbar-dark justify-content-center fixed-top" role="navigation">
    <div class="container justify-content-center">
        <a class="navbar-brand mx-auto font-bold brand" href="#Home">
            <i class="fas fa-vial brand-icon"></i> {{ name }}
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse"
            aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav mx-auto">
                <li *ngFor="let item of routeData" class="nav-item"
                    [ngClass]="activeRoute === item.name ? 'active' : ''" (click)="routeChange(item.name)">
                    <a class="nav-link" href="{{'#'+item.name}}">
                        <span [ngClass]="activeRoute === item.name ? 'route-text' : ''">{{item.name}}</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
